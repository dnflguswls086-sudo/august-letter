<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>난초반 8월의 편지</title><style>
:root{--navy:#1f3a66;--blue:#4b75aa;--paper:#fffdf8;--ink:#313845;--soft:#eaf2fb;--line:#d7e4f3;}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(150deg,#edf5ff 0%,#fffdf8 52%,#f2f7ff 100%);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:22px}
.wrap{width:min(760px,100%)}
.top{text-align:center;margin-bottom:13px;color:var(--navy)}
.kicker{font-size:13px;letter-spacing:.18em;font-weight:800;opacity:.68;margin-bottom:7px}.top h1{margin:0;font-size:clamp(26px,6vw,40px);letter-spacing:-.05em}.top .month{font-size:14px;margin-top:7px;opacity:.7}
.card{position:relative;background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:26px;padding:clamp(25px,6vw,52px);box-shadow:0 18px 55px rgba(31,58,102,.13);overflow:hidden}
.card:before,.card:after{content:"";position:absolute;border-radius:999px;background:var(--soft);z-index:0}.card:before{width:180px;height:180px;right:-70px;top:-85px}.card:after{width:120px;height:120px;left:-50px;bottom:-55px}.content{position:relative;z-index:1}
.to{font-size:clamp(25px,6vw,36px);font-weight:900;color:var(--navy);margin-bottom:25px;letter-spacing:-.05em}.hello{font-size:19px;font-weight:800;color:var(--blue);margin-bottom:18px}
p{font-size:clamp(16px,4vw,18px);line-height:1.92;letter-spacing:-.02em;margin:0 0 17px;word-break:keep-all}.sign{margin-top:30px;padding-top:21px;border-top:1px dashed #b9cce4;text-align:right;line-height:1.8;font-weight:700;color:#47617f}.tiny{text-align:center;font-size:12px;color:#7a8ca3;margin-top:14px}
.heart{display:inline-block;animation:float 2.3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-4px)}}
@media(max-width:480px){body{padding:14px}.card{border-radius:20px;padding:26px 22px}.hello{font-size:17px}p{line-height:1.84}}
</style></head><body><main class="wrap"><header class="top"><div class="kicker">NANCHO CLASS · LETTER</div><h1>8월의 편지 💌</h1></header><section class="card"><div class="content"><div class="to">난초반 친구들에게</div><p>각자 받은 QR코드를 찍으면 선생님이 보낸 개인 편지를 확인할 수 있어요.</p><p>친구의 편지가 아니라, <b>나에게 온 편지</b>를 천천히 읽어 보세요. 😊</p><div class="sign">난초반 담임 선생님이</div></div></section></main></body></html>
