<body><main class="page"><section class="paper"><div class="clip"></div><div class="head"><div class="month">8월</div><div class="to">민준이에게</div></div><div class="letter"><div class="greeting">민준아,</div><p>방학을 지나 다시 학교에서 만난 모습이 무척 반가웠어. 2학기는 1학기보다 시간이 훨씬 빠르게 지나갈 것 같아.</p><p>그래서 매일 똑같아 보이는 하루도 친구들과 많이 웃고, 새로운 것을 하나씩 경험하면서 알차게 보냈으면 좋겠어. 궁금한 것이 있다면 질문하고, 하고 싶은 것이 있다면 용기 있게 도전해 보렴.</p><p>민준이에게 기억에 남는 멋진 2학기가 되었으면 좋겠다!</p><div class="sign">9월에도 함께 좋은 추억 많이 만들자!<br>난초반 담임 선생님이</div></div></section>
<div class="footer">2026 · 난초반의 두 번째 학기를 시작하며</div></main></body></html>
