<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f6e8"><title>주원이에게 | 난초반 8월의 편지</title><style>:root{--paper:#e8f6e8;--rule:#bdddbf;--accent:#3d8b76;--accent2:#f2b86b;--tape:#a8d4a8;}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#28231f}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(135deg,#f6f7f9,#fff 45%,#f1f4f7)}
.wrap{width:min(820px,100%)}
.note{--paper:#fff5cf;--rule:#f2d98a;--accent:#3e7d62;--accent2:#f0b95c;--tape:#c8d8bc;position:relative;margin-top:30px;border:3px solid #222;border-radius:3px;background:var(--paper);box-shadow:0 14px 30px rgba(0,0,0,.10);padding:58px clamp(24px,6vw,58px) 38px;overflow:visible}
.note.grid{background-color:var(--paper);background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:24px 24px}
.note.line{background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 32px)}
.rings{position:absolute;left:34px;right:34px;top:-31px;height:53px;display:flex;justify-content:space-between;pointer-events:none}
.ring{width:18px;height:47px;border:4px solid #202020;border-radius:50%;background:#fff;transform:rotate(2deg)}
.header{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:24px;margin-bottom:28px;position:relative;z-index:2}
.month{font-size:clamp(56px,11vw,92px);line-height:.8;font-weight:1000;letter-spacing:-.09em;color:var(--accent);text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff;white-space:nowrap}
.month small{font-size:.55em;margin-left:2px}.recipient{font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:-.06em;padding-bottom:8px;border-bottom:4px solid var(--accent2);display:inline-block;width:max-content;max-width:100%}
.greeting{font-size:clamp(19px,4.2vw,24px);font-weight:900;margin:12px 0 20px;color:#332b28}
.letter{position:relative;z-index:2;background:rgba(255,255,255,.25);padding:0 4px}
p{font-size:clamp(16px,3.8vw,19px);line-height:1.88;letter-spacing:-.025em;margin:0 0 15px;word-break:keep-all;font-weight:600}
.sign{margin-top:28px;text-align:right;font-size:15px;line-height:1.75;font-weight:800;color:#55483e}
.sticker{position:absolute;right:18px;top:76px;font-size:42px;filter:drop-shadow(0 2px 0 rgba(255,255,255,.9));transform:rotate(7deg);z-index:1}.doodle{position:absolute;left:19px;bottom:12px;font-size:28px;transform:rotate(-8deg)}
.tape{position:absolute;width:120px;height:29px;background:var(--tape);opacity:.78;right:-18px;bottom:16px;transform:rotate(-7deg);border-radius:2px;background-image:radial-gradient(rgba(255,255,255,.9) 1.5px,transparent 1.5px);background-size:13px 13px}
.footer{text-align:center;margin-top:14px;font-size:12px;font-weight:700;color:#777}
@media(max-width:560px){body{padding:14px}.note{margin-top:24px;padding:50px 20px 30px}.rings{left:20px;right:20px;top:-27px}.ring{width:15px;height:41px;border-width:3px}.header{grid-template-columns:1fr;gap:12px;align-items:start}.month{font-size:64px}.recipient{font-size:31px}.sticker{font-size:34px;top:92px;right:13px}.tape{width:88px}}
</style></head>
<body><main class="wrap"><section class="note grid"><div class="rings"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span></div><div class="sticker">🌿</div><div class="header"><div class="month">8<small>월</small></div><div class="recipient">주원이에게</div></div><div class="letter"><div class="greeting">주원아,</div><p>벌써 5학년의 절반을 지나 2학기를 함께하고 있다는 게 신기하다. 새로운 학기에는 지난 학기보다 조금 더 여유롭게 친구들도 돌아보고, 주원이 스스로 하고 싶은 일에도 즐겁게 도전했으면 좋겠어.</p>
<p>꼭 모든 일을 완벽하게 해야 하는 것은 아니야. 실패해도 다시 해 보고, 친구들과 웃으면서 함께 해내는 경험도 아주 소중하단다.</p>
<p>이번 학기도 주원이다운 멋진 모습 많이 보여 줘!</p><div class="sign">9월에도 함께 좋은 추억 많이 만들자!<br>난초반 담임 선생님이</div></div><div class="doodle">♡</div><div class="tape"></div></section><div class="footer">2026 · 난초반의 두 번째 학기를 시작하며</div></main></body></html>
