<body><main class="page"><section class="paper"><div class="flap"></div><div class="seal">8月</div><div class="head"><div class="month">8월의 편지</div><div class="to">지완이에게</div></div><div class="letter"><div class="greeting">지완아,</div><p>방학 동안 잘 지냈지? 오랜만에 다시 만나 보니 난초반이 정말 다시 시작됐다는 느낌이 들더라.</p><p>지완이는 이번 학기에 여러 가지 새로운 활동에 조금 더 적극적으로 뛰어들어 보면 좋겠어. 재미있는 생각이 떠오르면 친구들과 나누고, 하고 싶은 일이 있다면 먼저 한번 시도해 보렴.</p><p>선생님은 지완이가 즐겁게 무언가에 빠져 있는 모습을 많이 보고 싶어. 2학기에도 신나게 지내 보자!</p><div class="sign">9월에도 함께 좋은 추억 많이 만들자!<br>난초반 담임 선생님이</div></div></section>
