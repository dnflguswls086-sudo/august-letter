<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1e5dc"><title>호진이에게 | 난초반 8월의 편지</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#2d2925}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:#f3f5f7}
.page{width:min(820px,100%);position:relative}
.paper{position:relative;min-height:570px}
.month{font-weight:1000;letter-spacing:-.09em;line-height:.85}
.to{font-weight:900;letter-spacing:-.055em}
.letter{font-size:clamp(16px,2.6vw,20px);line-height:1.9;letter-spacing:-.025em;word-break:keep-all}
.greeting{font-size:1.13em;font-weight:900;margin-bottom:12px}
.letter p{margin:0 0 15px}
.sign{margin-top:26px;text-align:right;font-weight:800;line-height:1.65}
.footer{text-align:center;margin-top:14px;font-size:12px;color:#777}
@media(max-width:560px){body{padding:14px}.paper{min-height:auto}.letter{line-height:1.78}.sign{margin-top:18px}}

body{background:linear-gradient(180deg,#eaf5f5,#f8fbfb)}
.page:before{content:"";position:absolute;top:-35px;left:4%;right:4%;height:6px;background:#68594c;border-radius:5px}
.paper{padding:70px clamp(28px,6vw,62px) 42px;background:#fffaf7;border-radius:20px;box-shadow:0 15px 35px #0002;border:2px solid #b98c6d}
.str1,.str2{position:absolute;top:-31px;width:3px;height:70px;background:#68594c}.str1{left:18%}.str2{right:18%}
.peg1,.peg2{position:absolute;top:-7px;width:30px;height:42px;background:#b98c6d;border-radius:5px;transform:rotate(4deg);box-shadow:0 3px 6px #0003}.peg1{left:calc(18% - 14px)}.peg2{right:calc(18% - 14px);transform:rotate(-4deg)}
.head{text-align:center;margin-bottom:28px}
.month{font-size:54px;color:#b98c6d;letter-spacing:.02em}
.to{font-size:43px;margin-top:8px}
.ribbon{display:inline-block;background:#f1e5dc;padding:8px 25px;border-radius:999px;margin-top:8px;font-size:14px;font-weight:800;color:#6d4a38}
</style></head>
<body><main class="page"><section class="paper"><div class="str1"></div><div class="str2"></div><div class="peg1"></div><div class="peg2"></div><div class="head"><div class="month">8월</div><div class="to">호진이에게</div><div class="ribbon">선생님이 보내는 작은 응원</div></div><div class="letter"><div class="greeting">호진아,</div><p>어느새 5학년의 두 번째 학기가 시작됐네. 시간이 참 빠르지?</p><p>이번 학기에는 결과도 중요하지만 그 과정에서 얼마나 즐겁게 참여하고 노력했는지도 많이 생각해 봤으면 좋겠어. 잘 안되는 일이 생겨도 조금 천천히 다시 해 보면 괜찮아.</p><p>호진이가 자기 속도로 꾸준히 앞으로 나아간다면 분명 학기 말에는 뿌듯한 일이 많이 생길 거야. 선생님과 끝까지 즐겁게 달려 보자!</p><div class="sign">9월에도 함께 좋은 추억 많이 만들자!<br>난초반 담임 선생님이</div></div></section>
<div class="footer">2026 · 난초반의 두 번째 학기를 시작하며</div></main></body></html>
